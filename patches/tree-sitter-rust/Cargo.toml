[package]
name = "tree-sitter-rust"
version = "0.23.3"
edition = "2021"
license = "MIT"
# Patched: grammar C sources pre-compiled to lib/libtree_sitter_rust.a for wasm32-wasip2
# (zig cc, see docs/WASM_BUILD_PATCHES.md) - the upstream build script needs a WASI C
# compiler. Native (host) builds still compile the C sources directly.
build = "build.rs"
autolib = false

[lib]
name = "tree_sitter_rust"
path = "bindings/rust/lib.rs"

[dependencies.tree-sitter-language]
version = "0.1"

[build-dependencies]
cc = "1"
